version: 2
dist: dist/snapshot

before:
  hooks:
    - go mod download
    - python3 scripts/generic-release.py prepare
    - python3 scripts/nfpm-release.py prepare
builds:
  - binary: obsgod
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=true
    ldflags: -s -w -buildid= -X main.version={{ .Version }} -X main.commitSHA={{ .Commit }}
    goos:
      - linux
      - freebsd
      - openbsd
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - 386
      - arm
    goarm:
      - 6
      - 7

archives:
  - format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: CHANGELOG.md
        info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: .local-ci/generic-release/THIRD_PARTY_NOTICES.md
        dst: .
        strip_parent: true
        info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: .local-ci/generic-release/GO-NOTICES.json
        dst: .
        strip_parent: true
        info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: .local-ci/generic-release/GENERIC-CLI.md
        dst: .
        strip_parent: true
        info:
          mode: 0644
          mtime: "{{ .CommitDate }}"

nfpms:
  - ids:
      - obsgod
    homepage: "https://github.com/szmyty/obsgod"
    maintainer: "szmyty"
    description: "obsgod is a command-line remote control for OBS"
    license: MIT
    formats:
      - apk
      - deb
      - rpm
    bindir: /usr/bin
    mtime: "{{ .CommitDate }}"
    rpm:
      compression: gzip
      buildhost: reproducible.obsgod.invalid
    deb:
      compression: gzip
    contents:
      - src: .local-ci/nfpm-release/LICENSE
        dst: /usr/share/doc/obsgod/LICENSE
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: .local-ci/nfpm-release/README.md
        dst: /usr/share/doc/obsgod/README.md
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: .local-ci/nfpm-release/CHANGELOG.md
        dst: /usr/share/doc/obsgod/CHANGELOG.md
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: .local-ci/nfpm-release/THIRD_PARTY_NOTICES.md
        dst: /usr/share/doc/obsgod/THIRD_PARTY_NOTICES.md
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: .local-ci/nfpm-release/GO-NOTICES.json
        dst: /usr/share/doc/obsgod/GO-NOTICES.json
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: .local-ci/nfpm-release/GENERIC-CLI.md
        dst: /usr/share/doc/obsgod/GENERIC-CLI.md
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: .local-ci/nfpm-release/SOURCE.json
        dst: /usr/share/doc/obsgod/SOURCE.json
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "0.0.0-dev.g{{ .ShortCommit }}"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
