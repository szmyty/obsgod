name: Steam Deck bug
description: Report a reproducible preview problem without credentials
body:
  - type: markdown
    attributes:
      value: "For Steam Deck / Decky problems. For standalone CLI problems, use the CLI / automation bug form. Never include stream keys, passwords, private setup links, wallet seeds, wipe-recovery archives or raw OBS profiles/logs. Follow [SECURITY.md](https://github.com/szmyty/obsgod/security/policy) for suspected vulnerabilities; do not post sensitive details here."
  - type: textarea
    id: versions
    attributes:
      label: Exact versions and platform
      description: App, plugin, updater, SteamOS channel/version, Decky, OBS and Deck model.
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Session
      options:
        - Gaming Mode
        - Desktop Mode
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected result and actual result
      description: Include the action, video mode, audio route and destination name only. Leave out the server URL and key.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Local clip, separate viewer and filtered diagnostics
      description: Say which checks passed, failed or were unrun. Paste only reviewed Diagnostic console output.
