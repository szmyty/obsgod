name: goreleaser
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.4'
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Non-publishing release configuration and snapshot
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a
        with:
          version: v2.20.2
          args: release --snapshot --skip=publish,sign --clean
      - name: Audit generic archives and reproduce unsigned inventories
        run: |
          python3 scripts/generic-release.py audit --revision "$(git rev-parse HEAD)" --artifacts dist/snapshot --output dist/snapshot/supply-chain
          cp dist/snapshot/supply-chain/AUDIT-SHA256SUMS "$RUNNER_TEMP/first-generic-audit-sums"
          python3 scripts/generic-release.py audit --revision "$(git rev-parse HEAD)" --artifacts dist/snapshot --output dist/snapshot/supply-chain
          diff -u "$RUNNER_TEMP/first-generic-audit-sums" dist/snapshot/supply-chain/AUDIT-SHA256SUMS
      - name: Audit Linux package contents and reproduce unsigned inventories
        run: |
          python3 scripts/nfpm-release.py audit --revision "$(git rev-parse HEAD)" --artifacts dist/snapshot --output dist/snapshot/nfpm-supply-chain
          cp dist/snapshot/nfpm-supply-chain/AUDIT-SHA256SUMS "$RUNNER_TEMP/first-nfpm-audit-sums"
          python3 scripts/nfpm-release.py audit --revision "$(git rev-parse HEAD)" --artifacts dist/snapshot --output dist/snapshot/nfpm-supply-chain
          diff -u "$RUNNER_TEMP/first-nfpm-audit-sums" dist/snapshot/nfpm-supply-chain/AUDIT-SHA256SUMS
      - name: Exercise native Linux amd64 package managers without network or OBS
        run: |
          docker pull debian:bookworm-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc
          docker pull fedora:43@sha256:f01112b9a1f1d0504ad962d9adfa401425033f8ab067e0a821904ebdde5b8ca5
          docker pull alpine:3.23@sha256:469c9ea410b9215eaee7976ba6c0639039b444be8e5d638f7abbada189971eb2
          nfpm_smoke="${OBSGOD_ACT_TEMP:-$RUNNER_TEMP}/obsgod-nfpm-smoke"
          printf 'OBSGOD_NFPM_SMOKE_EVIDENCE=%s\n' "$nfpm_smoke" >> "$GITHUB_ENV"
          python3 scripts/nfpm-release.py smoke --artifacts dist/snapshot --audit dist/snapshot/nfpm-supply-chain/SUMMARY.json --output "$nfpm_smoke/results"
      - name: Verify unprivileged Linux CLI installation without OBS
        run: |
          smoke_output="${OBSGOD_ACT_TEMP:-$RUNNER_TEMP}/obsgod-generic-smoke"
          printf 'OBSGOD_GENERIC_SMOKE_EVIDENCE=%s\n' "$smoke_output" >> "$GITHUB_ENV"
          python3 scripts/run-user-tests.py --output-root "$smoke_output" -- scripts/generic-release.py smoke --artifacts dist/snapshot --audit dist/snapshot/supply-chain/SUMMARY.json --output "$smoke_output/results"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generic-snapshot-audit-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/snapshot/supply-chain
            dist/snapshot/nfpm-supply-chain
            dist/snapshot/checksums.txt
            ${{ env.OBSGOD_GENERIC_SMOKE_EVIDENCE }}
            ${{ env.OBSGOD_NFPM_SMOKE_EVIDENCE }}
