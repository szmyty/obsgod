name: Documentation preview
on:
  push:
    branches: [master, main, 'codex/m2-*']
    paths:
      - 'site/**'
      - 'scripts/build-site.py'
      - 'scripts/generate-support.mjs'
      - 'product.json'
      - 'support.json'
      - '.github/FUNDING.yml'
      - 'steamdeck/decky/src/support*.mjs'
      - '.github/workflows/docs-preview.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/build-site.py'
      - 'scripts/generate-support.mjs'
      - 'product.json'
      - 'support.json'
      - '.github/FUNDING.yml'
      - 'steamdeck/decky/src/support*.mjs'
      - '.github/workflows/docs-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Check shared funding metadata and build offline preview
        run: |
          node scripts/generate-support.mjs --check
          python scripts/build-site.py
          python scripts/build-site.py --check
          python -B site/tests/test_build.py
      - name: Retain preview for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: decky-stream-docs-preview
          path: dist/site
          if-no-files-found: error
          retention-days: 7
